name: Verify production D1 schema after 0010-0013 (READ ONLY, signup CLOSED)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-production-d1-primary-schema.yml'
      - 'scripts/infra/verify-primary-production-migrations.mjs'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-production-d1-primary-schema.yml'
      - 'scripts/infra/verify-primary-production-migrations.mjs'

permissions:
  contents: read

concurrency:
  group: eloscanner-production-schema-read-only
  cancel-in-progress: false

jobs:
  syntax:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --check scripts/infra/verify-primary-production-migrations.mjs

  verify-production:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Read-only production D1 schema, mappings, signup and deployment isolation
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PRODUCTION_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          CLOUDFLARE_PRODUCTION_D1_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_D1_WRITE_TOKEN }}
        run: node scripts/infra/verify-primary-production-migrations.mjs
