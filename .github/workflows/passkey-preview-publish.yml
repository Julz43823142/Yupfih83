name: Build test and publish passkey feature preview only

on:
  push:
    branches:
      - feature/passkey-foundation-20261108
    paths:
      - .github/workflows/passkey-preview-publish.yml
      - account.js
      - account.html
      - scripts/passkey-client.mjs
      - lib/auth/**
      - functions/api/auth/**
      - tests/auth/**
      - package.json
      - package-lock.json

permissions:
  contents: read

concurrency:
  group: eloscanner-passkey-preview-publish
  cancel-in-progress: true

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/passkey-foundation-20261108
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run complete account unit/regression suite
        run: npm run test:auth
      - name: Build public website and WebAuthn browser client
        run: npm run build
      - name: Verify Cloudflare target is not the production branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PASSKEY_PREVIEW_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN, id=process.env.CLOUDFLARE_ACCOUNT_ID;
          if(!token||!id)throw Error('Missing isolated preview deployment credentials');
          const response=await fetch('https://api.cloudflare.com/client/v4/accounts/'+encodeURIComponent(id)+'/pages/projects/fairplaychess',{headers:{Authorization:'Bearer '+token}});
          if(!response.ok)throw Error('Cannot check Pages project');
          const payload=await response.json();
          if(!payload.success)throw Error('Cannot inspect Pages project');
          const project=payload.result;
          const target='feature/passkey-foundation-20261108';
          if(project.production_branch===target)throw Error('Refusing production branch deployment');
          if(project.deployment_configs?.preview?.env_vars?.PUBLIC_SIGNUP_ENABLED?.value!=='false')throw Error('Preview signup must remain disabled');
          const db=project.deployment_configs?.preview?.d1_databases?.AUTH_DB;
          if((db?.id||db?.database_id)!=='e1d84922-0f74-414f-8fe5-2c3ac48f7884')throw Error('Preview database binding is not isolated');
          console.log('Target is isolated feature-branch preview; preview D1 binding verified.');
          NODE
      - name: Deploy built site and Functions to isolated preview branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PASSKEY_PREVIEW_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler pages deploy dist --project-name fairplaychess --branch feature/passkey-foundation-20261108 --commit-hash "$GITHUB_SHA"

      - name: Verify deployed preview auth config and account script
        run: |
          node --input-type=module <<'NODE'
          const base='https://feature-passkey-foundation-2.fairplaychess.pages.dev';
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          let last;
          for(let attempt=0;attempt<12;attempt++){
            try{
              const configResponse=await fetch(base+'/api/auth/config',{headers:{'Cache-Control':'no-cache'}});
              const cfg=await configResponse.json();
              const scriptResponse=await fetch(base+'/account.js?v=11-phone-only-qr-handoff',{headers:{'Cache-Control':'no-cache'}});
              const script=await scriptResponse.text();
              const page=await (await fetch(base+'/account.html?view=signup',{headers:{'Cache-Control':'no-cache'}})).text();
              const qr=await (await fetch(base+'/phone-signup-qr.js?v=1',{headers:{'Cache-Control':'no-cache'}})).text();
              const start=script.indexOf("byId('registration-preview-form').addEventListener");
              const end=script.indexOf("byId('login-form').addEventListener",start);
              const signup=start>=0&&end>start?script.slice(start,end):'';
              if(configResponse.ok&&cfg.registrationOpen===false&&cfg.passkeyReady===true&&
                 !signup.includes('eloPasskey.signIn(')&&
                 signup.includes('created.username !== username.toLowerCase()') &&
                 signup.includes('window.eloPhoneSignup?.isPhone()') &&
                 page.includes('id="signup-phone-handoff"') &&
                 page.includes('phone-signup-qr.js?v=1') &&
                 qr.includes("const previewHost = 'feature-passkey-foundation-2.fairplaychess.pages.dev'")){
                console.log('Live preview registration DISABLED; passkey login retained and preview isolated.');
                process.exit(0);
              }
              last='config HTTP '+configResponse.status+', registrationOpen='+cfg.registrationOpen+', passkeyReady='+cfg.passkeyReady+', new signup script='+(signup.includes('created.username !== username.toLowerCase()'));
            }catch(error){last=String(error);}
            await sleep(3000);
          }
          throw Error('Preview not validated: '+last);
          NODE
