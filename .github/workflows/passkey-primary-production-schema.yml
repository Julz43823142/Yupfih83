name: Audit production D1 migration readiness (read-only; signup CLOSED)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/passkey-primary-production-schema.yml'

permissions:
  contents: read

concurrency:
  group: eloscanner-production-auth-schema
  cancel-in-progress: false

jobs:
  audit-schema:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect isolated production schema and recovery bookmark without writes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN,account=process.env.CLOUDFLARE_ACCOUNT_ID;
          if(!token||!/^[a-f0-9]{32}$/i.test(account||''))throw Error('Missing dedicated production credentials');
          const api='https://api.cloudflare.com/client/v4/accounts/'+account;
          const headers={Authorization:'Bearer '+token,'Content-Type':'application/json'};
          const get=async path=>{
            const r=await fetch(api+path,{headers,signal:AbortSignal.timeout(30000)});
            if(!r.ok)throw Error('Cloudflare read failed at '+path+' HTTP '+r.status+' (check scope: Pages Read for project, D1 Read for bookmark)');
            const j=await r.json();
            if(j.success!==true)throw Error('Cloudflare read rejected');
            return j.result;
          };
          const project=await get('/pages/projects/fairplaychess');
          const id=b=>b?.id||b?.database_id;
          const prod=project.deployment_configs?.production,prev=project.deployment_configs?.preview;
          if(project.production_branch!=='main'||
            id(prod?.d1_databases?.AUTH_DB)!=='82e07afa-79eb-47e5-aa77-5bac6fb5bbdf'||
            id(prev?.d1_databases?.AUTH_DB)!=='e1d84922-0f74-414f-8fe5-2c3ac48f7884')
            throw Error('Production/preview database isolation check failed');
          if(prod.env_vars?.PUBLIC_SIGNUP_ENABLED?.value!=='false')
            throw Error('Public signup is not explicitly disabled');
          if(project.source?.config?.production_deployments_enabled!==false||
            project.source?.config?.preview_deployment_setting!=='none')
            throw Error('Native Git deployments must remain disabled');
          const db='82e07afa-79eb-47e5-aa77-5bac6fb5bbdf';
          const bookmark=await get('/d1/database/'+db+'/time_travel/bookmark');
          if(!bookmark?.bookmark)throw Error('No D1 Time Travel bookmark available');
          // This is a READ-ONLY audit. No migrations, DDL, writes or restore calls.
          const query=async sql=>{
            const r=await fetch(api+'/d1/database/'+db+'/query',{
              method:'POST',headers,body:JSON.stringify({sql}),
              signal:AbortSignal.timeout(30000)
            });
            if(!r.ok)throw Error('D1 read query HTTP '+r.status);
            const j=await r.json();
            if(j.success!==true||(j.result||[]).some(x=>x.success===false))
              throw Error('D1 read query failed');
            return (j.result||[]).flatMap(x=>x.results||[]);
          };
          const objects=await query("SELECT name,type FROM sqlite_master WHERE name NOT LIKE 'sqlite_%' AND type IN ('table','trigger','index')");
          const present=new Set(objects.map(x=>x.name));
          for(const name of ['user','session','passkey','auth_passkey_login_proof'])
            if(!present.has(name))throw Error('Missing baseline auth object '+name);
          const migrationObjects=[
            'auth_primary_passkey','auth_primary_passkey_proof',
            'auth_recovery_code','auth_recovery_attempt','auth_primary_transfer_gate',
            'auth_primary_phone_transfer_attempt',
            'auth_primary_passkey_assign','auth_primary_passkey_no_delete',
            'auth_primary_passkey_no_id_change','auth_primary_passkey_no_reassign',
            'auth_primary_passkey_no_mapping_delete','auth_primary_passkey_no_user_change',
            'auth_primary_transfer_gate_valid'
          ];
          const found=migrationObjects.filter(x=>present.has(x));
          const counts=await query('SELECT (SELECT COUNT(*) FROM "user") AS users,(SELECT COUNT(*) FROM "passkey") AS passkeys');
          console.log(JSON.stringify({signupClosed:true,nativeGitDeploymentsDisabled:true,
            bookmarkAvailable:true,baselineTablesPresent:true,
            migrationObjectsPresent:found,users:Number(counts[0]?.users),passkeys:Number(counts[0]?.passkeys),
            migrationExecuted:false,restoreRehearsed:false}));
          if(found.length>0&&found.length!==migrationObjects.length)
            throw Error('Partial migration objects detected; inspect before any write');
          console.log('Read-only production D1 audit complete. No migration or signup change performed.');
          NODE
