name: Publish passkey login on EloScanner production (signup stays CLOSED)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eloscanner-production-passkey-publish
  cancel-in-progress: false

jobs:
  publish-production:
    environment: production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Require all account regression tests
        run: npm run test:auth
      - name: Build site and browser passkey client
        run: npm run build
      - name: Install Chromium for real passkey browser tests
        run: npx playwright install --with-deps chromium
      - name: Prepare isolated local account fixtures
        run: |
          npm run auth:migrate:local
          npm run auth:provision -- --local --fixture
          npm run auth:provision -- --local --fixture2
      - name: Require working passkey and password account flows in Chromium
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          LOCAL_PASSKEY_TEST=true npm run dev:auth > /tmp/eloscanner-prod-preflight.log 2>&1 &
          AUTH_DEV_PID=$!
          trap 'kill "$AUTH_DEV_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://localhost:8788/api/auth/config > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:8788/api/auth/config > /dev/null || { cat /tmp/eloscanner-prod-preflight.log; exit 1; }
          npx playwright test tests/auth/browser.spec.mjs tests/auth/passkey.spec.mjs tests/auth/passkey-signup.spec.mjs tests/auth/recovery-browser.spec.mjs tests/auth/phone-transfer-browser.spec.mjs tests/auth/qr-login-browser.spec.mjs
      - name: Refuse wrong production target or open registration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN,id=process.env.CLOUDFLARE_ACCOUNT_ID;
          if(!token||!id)throw Error('Cloudflare credentials missing');
          const api='https://api.cloudflare.com/client/v4/accounts/'+encodeURIComponent(id);
          const headers={Authorization:'Bearer '+token,'Content-Type':'application/json'};
          const response=await fetch(api+'/pages/projects/fairplaychess',{headers});
          if(!response.ok)throw Error('Cannot audit Cloudflare production project');
          const payload=await response.json();
          if(!payload.success)throw Error('Project audit failed');
          const project=payload.result;
          const prod=project.deployment_configs?.production, preview=project.deployment_configs?.preview;
          if(project.production_branch!=='main')throw Error('Production branch mismatch');
          if(project.source?.type!=='github' ||
             project.source?.config?.production_deployments_enabled!==false ||
             project.source?.config?.preview_deployment_setting!=='none')
            throw Error('Native Git production/preview deployments must remain disabled');
          const prodDB=prod?.d1_databases?.AUTH_DB,previewDB=preview?.d1_databases?.AUTH_DB;
          if((prodDB?.id||prodDB?.database_id)!=='82e07afa-79eb-47e5-aa77-5bac6fb5bbdf'||
             (previewDB?.id||previewDB?.database_id)!=='e1d84922-0f74-414f-8fe5-2c3ac48f7884')
             throw Error('Production/preview AUTH_DB binding mismatch');
          const vars=prod.env_vars||{};
          if(vars.PUBLIC_SIGNUP_ENABLED?.value!=='false'||vars.PASSKEY_LOGIN_ENABLED?.value!=='true'||
             vars.PASSKEY_RP_ID?.value!=='eloscanner.com'||!vars.BETTER_AUTH_SECRET)
            throw Error('Production auth config or closed-registration safety guard failed');
          console.log('Production database isolated; passkey login enabled; public registration disabled.');
          NODE
      - name: Require complete 0010-0013 D1 security schema before any publication
        env:
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_D1_WRITE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CLOUDFLARE_D1_API_TOKEN,account=process.env.CLOUDFLARE_ACCOUNT_ID;
          if(!token||!/^[a-f0-9]{32}$/i.test(account||''))throw Error('Protected production D1 credential unavailable');
          const url='https://api.cloudflare.com/client/v4/accounts/'+account+
            '/d1/database/82e07afa-79eb-47e5-aa77-5bac6fb5bbdf/query';
          const sql="SELECT name,type FROM sqlite_master WHERE type IN ('table','trigger','index')";
          const r=await fetch(url,{method:'POST',headers:{
            Authorization:'Bearer '+token,'Content-Type':'application/json'
          },body:JSON.stringify({sql}),signal:AbortSignal.timeout(30000)});
          if(!r.ok)throw Error('Production D1 schema read HTTP '+r.status);
          const j=await r.json();
          if(j.success!==true||!Array.isArray(j.result)||
            j.result.some(x=>x.success===false))throw Error('Production D1 schema inspection failed');
          const found=new Set(j.result.flatMap(x=>x.results||[]).map(x=>x.name));
          const required=[
            'auth_qr_login','auth_qr_login_session_once_idx','auth_primary_passkey','auth_primary_passkey_proof',
            'auth_primary_passkey_assign','auth_primary_passkey_no_delete',
            'auth_primary_passkey_no_id_change','auth_primary_passkey_no_reassign',
            'auth_primary_passkey_no_mapping_delete','auth_primary_passkey_no_user_change',
            'auth_recovery_code','auth_recovery_attempt',
            'auth_primary_transfer_gate','auth_primary_transfer_gate_valid',
            'auth_primary_phone_transfer_attempt'
          ];
          const missing=required.filter(x=>!found.has(x));
          if(missing.length)throw Error('Production 0010-0013 incomplete: missing '+missing.join(','));
          console.log('Complete primary/recovery/phone-transfer database controls verified. Public signup remains CLOSED.');
          NODE
      - name: Deploy built Functions and site to production branch ONLY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler pages deploy dist --project-name fairplaychess --branch main --commit-hash "$GITHUB_SHA"
      - name: Verify live EloScanner passkey login and closed signup
        run: |
          node --input-type=module <<'NODE'
          const base='https://eloscanner.com';
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          let reason='not reached';
          for(let attempt=0;attempt<15;attempt++){
            try{
              const r=await fetch(base+'/api/auth/config',{headers:{'Cache-Control':'no-cache'}});
              const cfg=await r.json();
              // Query-string cache busting prevents stale HTML at the edge
              // from producing a false-negative after a successful deploy.
              const pageResponse=await fetch(base+'/account.html?deploy='+encodeURIComponent(process.env.GITHUB_SHA)+'&check='+attempt,{
                headers:{'Cache-Control':'no-store','Pragma':'no-cache'}
              });
              const page=await pageResponse.text();
              const phoneScript=page.includes('phone-account-qr.js?v=1');
              const qrScript=page.includes('account.js?v=17-qr-cancel');
              const signup=await fetch(base+'/api/auth/sign-up/email',{
                method:'POST',headers:{Origin:base,'Content-Type':'application/json'},
                body:JSON.stringify({username:'no_public_password_registration',password:'not-used'})
              });
              const phoneSignup=await fetch(base+'/api/auth/passkey-signup/options',{
                method:'POST',headers:{Origin:base,'Content-Type':'application/json'},
                body:JSON.stringify({username:'no_public_phone_registration',turnstileToken:'not-used'})
              });
              const configValid=r.ok && cfg.passkeyReady===true && cfg.qrLoginReady===true && cfg.loginConfigured===true &&
                cfg.registrationOpen===false && pageResponse.ok && phoneScript && qrScript;
              if(configValid && signup.status===403 && phoneSignup.status===404) {
                console.log('LIVE PRODUCTION: passkey login ready; both password and phone signup CLOSED; account migration UI published.');
                process.exit(0);
              }
              reason='auth='+r.status+', passkeyReady='+cfg.passkeyReady+', registrationOpen='+cfg.registrationOpen+
                ', pageHttp='+pageResponse.status+', phoneScript='+phoneScript+', qrScript='+qrScript+', passwordSignup='+signup.status+', passkeySignup='+phoneSignup.status;
            }catch(error){reason=String(error);}
            await sleep(4000);
          }
          throw Error('Production smoke failed: '+reason);
          NODE
