name: Deploy private online chess room (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-private-online-chess-room
  cancel-in-progress: false

jobs:
  deploy-room:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: online-room-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify required Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN secret'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID secret'; exit 1; }
      - name: Install locked dependencies
        run: npm ci
      - name: Enforce no public Worker hostname or routes
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const cfg=JSON.parse(fs.readFileSync("workers/online-room.wrangler.jsonc","utf8"));
            if(cfg.name!=="eloscanner-online-room" || cfg.workers_dev!==false || (cfg.routes||[]).length || cfg.route || cfg.triggers?.routes?.length) {
              throw Error("Refusing deployment: public route or workers.dev not disabled");
            }
            if(!cfg.durable_objects?.bindings?.some(b=>b.name==="ONLINE_ROOM" && b.class_name==="OnlineChessRoom")) {
              throw Error("Missing OnlineChessRoom Durable Object binding");
            }
          '
      - name: Deploy private Durable Object Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler deploy --config workers/online-room.wrangler.jsonc
