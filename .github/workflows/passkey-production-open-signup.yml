name: OPEN production phone-passkey registration (manual only)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type ENABLE_PASSKEY_SIGNUP to intentionally open PUBLIC registration on eloscanner.com'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: eloscanner-production-passkey-signup-switch
  cancel-in-progress: false

jobs:
  enable-signup:
    environment: production
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'ENABLE_PASSKEY_SIGNUP'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:auth
      - run: npm run build
      - name: Strictly verify production is ready and registration is still closed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN,id=process.env.CLOUDFLARE_ACCOUNT_ID;
          if(!token||!id)throw Error('Cloudflare credentials missing');
          const api='https://api.cloudflare.com/client/v4/accounts/'+encodeURIComponent(id);
          const headers={Authorization:'Bearer '+token,'Content-Type':'application/json'};
          const r=await fetch(api+'/pages/projects/fairplaychess',{headers});
          if(!r.ok)throw Error('Cannot audit Pages configuration');
          const project=(await r.json()).result;
          const prod=project.deployment_configs?.production||{};
          const prodDb=prod.d1_databases?.AUTH_DB;
          if(project.production_branch!=='main'||(prodDb?.id||prodDb?.database_id)!=='82e07afa-79eb-47e5-aa77-5bac6fb5bbdf')
            throw Error('Wrong production target');
          const vars=prod.env_vars||{};
          if(vars.PUBLIC_SIGNUP_ENABLED?.value!=='false'||vars.PASSKEY_LOGIN_ENABLED?.value!=='true'||vars.PASSKEY_RP_ID?.value!=='eloscanner.com')
            throw Error('Unexpected production signup/passkey flags; abort');
          const q=await fetch(api+'/d1/database/82e07afa-79eb-47e5-aa77-5bac6fb5bbdf/query',{
            method:'POST',headers,body:JSON.stringify({sql:"SELECT name FROM sqlite_master WHERE type='table' AND name IN ('passkey','auth_passkey_stepup','auth_passkey_signup_attempt','auth_passkey_login_proof')"})});
          if(!q.ok)throw Error('Cannot check production D1');
          const tables=new Set((await q.json()).result?.[0]?.results?.map(x=>x.name));
          for(const name of ['passkey','auth_passkey_stepup','auth_passkey_signup_attempt','auth_passkey_login_proof'])
            if(!tables.has(name))throw Error('Missing '+name);
          const cfg=await fetch('https://eloscanner.com/api/auth/config',{headers:{'Cache-Control':'no-cache'}}).then(r=>r.json());
          if(cfg.registrationOpen!==false||cfg.passkeyReady!==true)throw Error('Live production not ready or signup already enabled');
          console.log('All preconditions verified; registration currently closed.');
          NODE
      - name: Explicitly enable only the production passkey registration switch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const url='https://api.cloudflare.com/client/v4/accounts/'+encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID)+'/pages/projects/fairplaychess';
          const headers={Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'Content-Type':'application/json'};
          const response=await fetch(url,{method:'PATCH',headers,body:JSON.stringify({
            deployment_configs:{production:{env_vars:{PUBLIC_SIGNUP_ENABLED:{type:'plain_text',value:'true'}}}}
          })});
          if(!response.ok||(await response.json()).success!==true)throw Error('Cloudflare signup switch failed');
          console.log('Production-only signup flag enabled. Publishing new build now.');
          NODE
      - name: Publish production on main using the verified build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler pages deploy dist --project-name fairplaychess --branch main --commit-hash "$GITHUB_SHA"
      - name: Confirm live production registration and deny password registration
        run: |
          node --input-type=module <<'NODE'
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          for(let i=0;i<15;i++){
            const cfg=await fetch('https://eloscanner.com/api/auth/config',{cache:'no-store'}).then(r=>r.json());
            if(cfg.registrationOpen===true&&cfg.passkeyReady===true){
              const password=await fetch('https://eloscanner.com/api/auth/sign-up/email',{
                method:'POST',headers:{Origin:'https://eloscanner.com','Content-Type':'application/json'},
                body:JSON.stringify({username:'should_not_exist',password:'no-password-registrations'})
              });
              if(password.status!==403)throw Error('Password signup unexpectedly open');
              console.log('Production passkey signup OPEN, legacy password registration CLOSED.');
              process.exit(0);
            }
            await sleep(3000);
          }
          throw Error('Production signup could not be confirmed');
          NODE
