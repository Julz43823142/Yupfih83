name: Redeploy EloScanner passkey preview only

on:
  push:
    branches:
      - feature/passkey-foundation-20261108
    paths:
      - .github/workflows/passkey-preview-redeploy.yml

permissions:
  contents: read

jobs:
  preview-redeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Retry latest matching preview deployment without touching production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PASSKEY_PREVIEW_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN, account=process.env.CLOUDFLARE_ACCOUNT_ID;
          if(!token||!account) throw Error('Missing preview credentials');
          const base='https://api.cloudflare.com/client/v4/accounts/'+encodeURIComponent(account)+'/pages/projects/fairplaychess';
          const headers={Authorization:'Bearer '+token,Accept:'application/json'};
          const read=async url=>{const r=await fetch(url,{headers});if(!r.ok)throw Error('Cloudflare GET HTTP '+r.status);const x=await r.json();if(!x.success)throw Error('Cloudflare GET failed');return x.result;};
          const project=await read(base);
          if(project.deployment_configs?.preview?.env_vars?.PUBLIC_SIGNUP_ENABLED?.value!=='true')throw Error('Preview signup flag is not enabled');
          const productionBefore=JSON.stringify(project.deployment_configs?.production);
          const deployments=await read(base+'/deployments');
          const candidates=(Array.isArray(deployments)?deployments:deployments?.deployments||[]).filter(d=>
            d.environment==='preview' && d.deployment_trigger?.metadata?.branch==='feature/passkey-foundation-20261108');
          const latest=candidates.sort((a,b)=>Date.parse(b.created_on)-Date.parse(a.created_on))[0];
          if(!latest?.id)throw Error('No matching feature-branch preview deployment; refusing to retry another environment');
          console.log('Retrying feature branch preview deployment ID '+latest.id);
          const response=await fetch(base+'/deployments/'+encodeURIComponent(latest.id)+'/retry',{method:'POST',headers});
          if(!response.ok)throw Error('Preview retry HTTP '+response.status);
          const data=await response.json();if(!data.success)throw Error('Preview retry rejected');
          const after=await read(base);
          if(JSON.stringify(after.deployment_configs?.production)!==productionBefore)throw Error('Production config changed unexpectedly');
          console.log('Preview redeploy requested; production configuration unchanged');
          NODE
