name: Enable phone-passkey signup on preview only

on:
  push:
    branches:
      - feature/passkey-foundation-20261108
    paths:
      - .github/workflows/passkey-preview-enable.yml

permissions:
  contents: read

jobs:
  enable-preview-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable preview registration with strict environment guards
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PASSKEY_PREVIEW_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN, account=process.env.CLOUDFLARE_ACCOUNT_ID;
          if(!token||!account) throw Error('Missing Cloudflare preview credentials');
          const url='https://api.cloudflare.com/client/v4/accounts/'+encodeURIComponent(account)+'/pages/projects/fairplaychess';
          const headers={Authorization:'Bearer '+token,Accept:'application/json','Content-Type':'application/json'};
          const get=async()=>{const r=await fetch(url,{headers});if(!r.ok)throw Error('Project lookup HTTP '+r.status);const x=await r.json();if(!x.success)throw Error('Project lookup failed');return x.result;};
          const p=await get(), preview=p.deployment_configs?.preview, production=p.deployment_configs?.production;
          if(!preview||!production) throw Error('Missing separate preview/production configuration');
          const vars=preview.env_vars||{};
          const has=k=>vars[k] && (String(vars[k].type||'').includes('secret') || (typeof vars[k].value==='string' && vars[k].value.length>0));
          if(preview.d1_databases?.AUTH_DB?.id!=='e1d84922-0f74-414f-8fe5-2c3ac48f7884' &&
             preview.d1_databases?.AUTH_DB?.database_id!=='e1d84922-0f74-414f-8fe5-2c3ac48f7884') throw Error('Refusing unexpected D1 database');
          if(vars.BETTER_AUTH_URL?.value!=='https://feature-passkey-foundation-2.fairplaychess.pages.dev' ||
             vars.PASSKEY_RP_ID?.value!=='feature-passkey-foundation-2.fairplaychess.pages.dev' ||
             vars.PASSKEY_LOGIN_ENABLED?.value!=='true' ||
             !has('BETTER_AUTH_SECRET') || !has('TURNSTILE_SITE_KEY') || !has('TURNSTILE_SECRET_KEY')) throw Error('Preview readiness prerequisites missing');
          if(vars.PUBLIC_SIGNUP_ENABLED?.value==='true') {console.log('Preview signup already enabled; no changes');process.exit(0);}
          const body={deployment_configs:{preview:{env_vars:{PUBLIC_SIGNUP_ENABLED:{type:'plain_text',value:'true'}}}}};
          const response=await fetch(url,{method:'PATCH',headers,body:JSON.stringify(body)});
          if(!response.ok) throw Error('Preview setting update HTTP '+response.status);
          const result=await response.json();if(!result.success)throw Error('Preview setting update failed');
          const after=await get();
          if(after.deployment_configs?.preview?.env_vars?.PUBLIC_SIGNUP_ENABLED?.value!=='true') throw Error('Preview flag not persisted');
          if(JSON.stringify(after.deployment_configs?.production)!==JSON.stringify(production)) throw Error('Production configuration unexpectedly changed');
          const remaining=after.deployment_configs?.preview?.env_vars||{};
          if(!has('BETTER_AUTH_SECRET') || !remaining.TURNSTILE_SECRET_KEY || !remaining.TURNSTILE_SITE_KEY) throw Error('Preview secrets not retained');
          console.log('Preview signup enabled. Production configuration unchanged. Existing deployment may require redeploy.');
          NODE
