name: Audit EloScanner passkey preview configuration
# Recheck preview settings after Turnstile keys were added.

on:
  push:
    branches:
      - feature/passkey-foundation-20261108
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read Pages preview settings without exposing secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PASSKEY_PREVIEW_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          if(!token || !account) throw new Error('Missing dedicated preview credentials');
          const response=await fetch('https://api.cloudflare.com/client/v4/accounts/'+encodeURIComponent(account)+'/pages/projects/fairplaychess',{
            headers:{Authorization:'Bearer '+token,Accept:'application/json'}
          });
          if(!response.ok) throw new Error('Pages project lookup failed: HTTP '+response.status);
          const data=await response.json();
          if(!data.success) throw new Error('Pages API did not return success');
          const project=data.result;
          const preview=project?.deployment_configs?.preview;
          const prod=project?.deployment_configs?.production;
          if(!preview || !prod) throw new Error('Expected distinct preview and production configurations');
          const env=preview.env_vars || {};
          const has=k=>Object.hasOwn(env,k) && env[k]!==null && (String(env[k].type||'').includes('secret') || (typeof env[k].value==='string' && env[k].value.length>0));
          const defined=k=>Object.hasOwn(env,k) && env[k]!==null;
          const vars=['BETTER_AUTH_URL','BETTER_AUTH_SECRET','PASSKEY_RP_ID','PASSKEY_LOGIN_ENABLED','PUBLIC_SIGNUP_ENABLED','TURNSTILE_SITE_KEY','TURNSTILE_SECRET_KEY'];
          for(const key of vars) console.log(key+': '+(defined(key)?'present':'missing'));
          const db=preview.d1_databases?.AUTH_DB;
          const id=db?.id || db?.database_id;
          console.log('Preview D1 AUTH_DB target: '+(id==='e1d84922-0f74-414f-8fe5-2c3ac48f7884'?'correct':id?'unexpected':'missing'));
          console.log('Preview signup switch: '+(env.PUBLIC_SIGNUP_ENABLED?.value==='true'?'enabled':'disabled'));
          console.log('Production signup switch: '+(prod.env_vars?.PUBLIC_SIGNUP_ENABLED?.value==='true'?'enabled':'disabled or not explicitly enabled'));
          const ready=has('BETTER_AUTH_SECRET') && has('TURNSTILE_SECRET_KEY') && has('TURNSTILE_SITE_KEY') &&
            env.BETTER_AUTH_URL?.value==='https://feature-passkey-foundation-2.fairplaychess.pages.dev' &&
            env.PASSKEY_RP_ID?.value==='feature-passkey-foundation-2.fairplaychess.pages.dev' &&
            env.PASSKEY_LOGIN_ENABLED?.value==='true' &&
            id==='e1d84922-0f74-414f-8fe5-2c3ac48f7884';
          console.log('Preview auth URL matches expected hostname: '+(env.BETTER_AUTH_URL?.value==='https://feature-passkey-foundation-2.fairplaychess.pages.dev'?'yes':'no'));
          console.log('Preview passkey RP ID matches expected hostname: '+(env.PASSKEY_RP_ID?.value==='feature-passkey-foundation-2.fairplaychess.pages.dev'?'yes':'no'));
          console.log('Preview passkey login flag enabled: '+(env.PASSKEY_LOGIN_ENABLED?.value==='true'?'yes':'no'));
          console.log('Preview auth secret configured: '+(has('BETTER_AUTH_SECRET')?'yes':'no'));
          console.log('Preview Turnstile secret configured: '+(has('TURNSTILE_SECRET_KEY')?'yes':'no'));
          console.log('Preview Turnstile site key configured: '+(has('TURNSTILE_SITE_KEY')?'yes':'no'));
          console.log('Ready to enable preview signup: '+(ready?'yes':'no'));
          NODE
