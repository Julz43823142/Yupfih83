name: Prepare passkey dependency lockfile (review artifact)
on:
  push:
    branches: [feature/passkey-foundation-20261108]

permissions:
  contents: write

jobs:
  lockfile-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Generate exact passkey dependency lockfile in runner only
        run: npm install --package-lock-only --ignore-scripts --save-exact --no-fund @better-auth/passkey@1.7.17
      - name: Check package version alignment
        run: |
          node -e "const p=require('./package.json');if(p.dependencies['better-auth']!==p.dependencies['@better-auth/passkey'])process.exit(1)"
      - name: Commit generated manifests to isolated PR branch only
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/passkey-foundation-20261108'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Pin Better Auth passkey plugin with reviewed npm lockfile"
            git push origin HEAD:refs/heads/feature/passkey-foundation-20261108
          fi
      - name: Archive generated manifests for manual PR review
        uses: actions/upload-artifact@v4
        with:
          name: passkey-dependency-manifests
          path: |
            package.json
            package-lock.json
          retention-days: 2
