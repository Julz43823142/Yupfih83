name: Security and performance regression checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci
      - name: Test account security boundaries
        run: npm run test:auth
      - name: Adversarial online chess and security tests
        run: node --test tests/online/security.test.mjs
      - name: Build public assets
        run: npm run build
      - name: Test endpoint JSON validation and cache policy
        run: node scripts/test-api-security.mjs
      - name: Test Play Bots premove input
        run: node scripts/test-play-premoves.mjs
      - name: Check JavaScript syntax
        run: |
          node --check online.js
          node --check account-nav.js
          node --check functions/api/online/'[[path]].js'
          node --check functions/api/social/'[[path]].js'
          node --check lib/online/security.mjs
          node --check play.js
          node --check play-bot-controls.mjs
          node --check puzzles.js
          node --check puzzle-pool-client.js
          node --check lib/server-request-guard.js
          node --check functions/api/puzzle-leaderboard.js
          node --check functions/api/knight-maze.js
          node --check functions/api/puzzle-report.js
          node --check script.js
          node --check analysis-stockfish-fixed.js

  account-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run auth:migrate:local
      - run: npm run auth:provision -- --local --fixture
      - run: npm run auth:provision -- --local --fixture2
      - name: Exercise real local Workers and D1 in Chromium
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npm run dev:auth > /tmp/eloscanner-auth-dev.log 2>&1 &
          AUTH_DEV_PID=$!
          trap 'kill "$AUTH_DEV_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://localhost:8788/api/auth/config > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:8788/api/auth/config > /dev/null
          npx playwright test
