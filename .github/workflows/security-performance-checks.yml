name: Security and performance regression checks
on:
  pull_request:
    branches: [main, feature/online-chess-3plus0, security/online-beta-prelaunch-20261105]
  push:
    branches: [main, security/online-beta-prelaunch-20261105, feature/online-websocket-delivery-20261105]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci
      - name: Benchmark existing password hashing CPU cost (diagnostic only)
        run: npm run auth:benchmark
      - name: Test account security boundaries
        run: npm run test:auth
      - name: Adversarial online chess and security tests
        run: node --test tests/online/security.test.mjs
      - name: Audit production dependencies for high-severity advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Build public assets
        run: npm run build
      - name: Test endpoint JSON validation and cache policy
        run: node scripts/test-api-security.mjs
      - name: Test Play Bots premove input
        run: node scripts/test-play-premoves.mjs
      - name: Check JavaScript syntax
        run: |
          node --check online.js
          node --check account-nav.js
          node --check functions/api/online/'[[path]].js'
          node --check functions/api/social/'[[path]].js'
          node --check lib/online/security.mjs
          node --check play.js
          node --check play-bot-controls.mjs
          node --check puzzles.js
          node --check puzzle-pool-client.js
          node --check lib/server-request-guard.js
          node --check functions/api/puzzle-leaderboard.js
          node --check functions/api/knight-maze.js
          node --check functions/api/puzzle-report.js
          node --check script.js
          node --check analysis-stockfish-fixed.js

  account-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run auth:migrate:local
      - run: npm run auth:provision -- --local --fixture
      - run: npm run auth:provision -- --local --fixture2
      - name: Exercise real local Workers and D1 in Chromium
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npm run dev:auth > /tmp/eloscanner-auth-dev.log 2>&1 &
          AUTH_DEV_PID=$!
          trap 'kill "$AUTH_DEV_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://localhost:8788/api/auth/config > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:8788/api/auth/config > /dev/null
          npx playwright test tests/auth/online.spec.mjs
          npx playwright test tests/auth/browser.spec.mjs tests/auth/arcade.spec.mjs

  realtime-websocket:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # Runner already includes Chromium system libraries; avoid slow apt for this test.
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm run auth:migrate:local
      - name: Exercise actual WebSocket transport using local workerd and Durable Objects
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npx wrangler dev --config workers/online-room.wrangler.jsonc --port 8790 --local > /tmp/eloscanner-room.log 2>&1 &
          ROOM_PID=$!
          LOCAL_ONLINE_ROOM=true npm run dev:auth > /tmp/eloscanner-pages.log 2>&1 &
          PAGES_PID=$!
          trap 'kill "$PAGES_PID" "$ROOM_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8788/api/auth/config > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:8788/api/auth/config > /dev/null || { cat /tmp/eloscanner-room.log; cat /tmp/eloscanner-pages.log; exit 1; }
          npx playwright test --config playwright.websocket.config.mjs || { cat /tmp/eloscanner-room.log; cat /tmp/eloscanner-pages.log; exit 1; }
