name: Vendor Stockfish 19 browser engine
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-stockfish.yml'
      - 'analysis.html'
permissions:
  contents: read
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download and validate official Stockfish engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/stockfish
          npm pack stockfish@19.0.1 --pack-destination /tmp --silent
          tar -xzf /tmp/stockfish-19.0.1.tgz -C /tmp
          cp /tmp/package/bin/stockfish-19-lite-single.js vendor/stockfish/
          cp /tmp/package/bin/stockfish-19-lite-single.wasm vendor/stockfish/
          test "$(wc -c < vendor/stockfish/stockfish-19-lite-single.js)" -gt 10000
          test "$(wc -c < vendor/stockfish/stockfish-19-lite-single.wasm)" -gt 100000
          test "$(od -An -tx1 -N4 vendor/stockfish/stockfish-19-lite-single.wasm | tr -d '[:space:]')" = 0061736d
      - name: Upload engine binaries for a reviewed pull request
        uses: actions/upload-artifact@v4
        with:
          name: stockfish-vendor-review
          path: vendor/stockfish/
          retention-days: 7
