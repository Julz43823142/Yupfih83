name: Publish current main to EloScanner production (protected release)
on:
  push:
    branches: [main]
    paths:
      - '.github/release-pawn-dash-123.txt'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY_MAIN to publish current main without changing production settings'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: eloscanner-production-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.confirm == 'DEPLOY_MAIN')
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run authentication and arcade regression tests
        run: npm run test:auth
      - name: Build current main
        run: npm run build
      - name: Ensure Pawn Dash redesign is included in the production build
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const world=readFileSync('dist/pawn-world.js','utf8');
          const page=readFileSync('dist/arcade.html','utf8');
          const bundle=readFileSync('dist/arcade-bundle.js','utf8');
          if(!world.includes('function drawPawn(')||!world.includes('function tree(')||
             !page.includes('20261110-pawn-world-redesign-2')||
             !bundle.includes('20261110-world2'))
            throw Error('Pawn Dash redesign missing from build');
          NODE
      - name: Verify production isolation and snapshot existing registration settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          const token=process.env.CLOUDFLARE_API_TOKEN,account=process.env.CLOUDFLARE_ACCOUNT_ID;
          if(!token||!account)throw Error('Missing production Pages credentials');
          const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+encodeURIComponent(account)+'/pages/projects/fairplaychess',{
            headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(20000)});
          if(!r.ok)throw Error('Production project inspection HTTP '+r.status);
          const data=await r.json(),p=data.result,prod=p?.deployment_configs?.production,prev=p?.deployment_configs?.preview;
          if(data.success!==true||p.production_branch!=='main'||
             (prod?.d1_databases?.AUTH_DB?.id||prod?.d1_databases?.AUTH_DB?.database_id)!=='82e07afa-79eb-47e5-aa77-5bac6fb5bbdf'||
             (prev?.d1_databases?.AUTH_DB?.id||prev?.d1_databases?.AUTH_DB?.database_id)!=='e1d84922-0f74-414f-8fe5-2c3ac48f7884')
            throw Error('Production/preview isolation check failed');
          if(p.source?.type==='github'&&(p.source.config?.production_deployments_enabled!==false||
             p.source.config?.preview_deployment_setting!=='none'))
            throw Error('Native Git deployments must remain paused');
          const vars=prod.env_vars||{},flag=vars.PUBLIC_SIGNUP_ENABLED?.value;
          if(!['true','false'].includes(flag)||vars.PASSKEY_LOGIN_ENABLED?.value!=='true'||
             vars.PASSKEY_RP_ID?.value!=='eloscanner.com'||!vars.BETTER_AUTH_SECRET)
            throw Error('Unexpected production authentication settings');
          const live=await fetch('https://eloscanner.com/api/auth/config?before='+Date.now(),{
            headers:{'Cache-Control':'no-store'}}).then(x=>x.json());
          if(live.registrationOpen!==(flag==='true')||live.passkeyReady!==true)
            throw Error('Live signup differs from configured production state');
          appendFileSync(process.env.GITHUB_ENV,'EXPECTED_SIGNUP_OPEN='+flag+'\n');
          console.log('Verified protected D1, paused Git deployments, passkey configuration, signup='+flag);
          NODE
      - name: Deploy built site and Functions without changing project variables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler pages deploy dist --project-name fairplaychess --branch main --commit-hash "$GITHUB_SHA"
      - name: Verify live Pawn Dash and unchanged registration
        run: |
          node --input-type=module <<'NODE'
          const base='https://eloscanner.com',expected=process.env.EXPECTED_SIGNUP_OPEN==='true';
          let last='not checked';
          for(let i=0;i<18;i++){
            try{
              const nonce=encodeURIComponent(process.env.GITHUB_SHA+'-'+i);
              const [worldRes,pageRes,configRes]=await Promise.all([
                fetch(base+'/pawn-world.js?release='+nonce,{headers:{'Cache-Control':'no-store'}}),
                fetch(base+'/arcade.html?release='+nonce,{headers:{'Cache-Control':'no-store'}}),
                fetch(base+'/api/auth/config?release='+nonce,{headers:{'Cache-Control':'no-store'}})
              ]);
              const [world,page,config]=await Promise.all([worldRes.text(),pageRes.text(),configRes.json()]);
              const password=await fetch(base+'/api/auth/sign-up/email',{
                method:'POST',headers:{Origin:base,'Content-Type':'application/json'},
                body:JSON.stringify({username:'production_release_probe',password:'invalid'})
              });
              if(worldRes.ok&&pageRes.ok&&configRes.ok&&
                 world.includes('function drawPawn(')&&world.includes('function tree(')&&
                 page.includes('20261110-pawn-world-redesign-2')&&
                 config.registrationOpen===expected&&config.passkeyReady===true&&password.status===403){
                console.log('LIVE: redesigned Pawn Dash published; registration preserved ('+expected+'); password signup blocked.');
                process.exit(0);
              }
              last='world='+worldRes.status+', page='+pageRes.status+', config='+configRes.status+
                ', marker='+world.includes('function drawPawn(')+', registration='+config.registrationOpen+
                ', password='+password.status;
            }catch(e){last=String(e)}
            await new Promise(resolve=>setTimeout(resolve,4000));
          }
          throw Error('Production release verification failed: '+last);
          NODE
