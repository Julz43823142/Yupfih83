name: Apply QR login D1 schema (signup stays CLOSED)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type APPLY_0015_QR_LOGIN_SIGNUP_CLOSED'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: eloscanner-production-auth-schema
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'APPLY_0015_QR_LOGIN_SIGNUP_CLOSED'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Apply only additive QR login schema to protected production D1
        env:
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PRODUCTION_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          CLOUDFLARE_PRODUCTION_D1_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_D1_WRITE_TOKEN }}
        run: node scripts/infra/apply-qr-login-production-schema.mjs
