<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#030d1b">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="EloScanner is being upgraded. We'll be back soon.">
<title>EloScanner | Under Construction</title>
<style>
:root{color-scheme:dark;--bg:#030d1b;--cyan:#4de2ff;--muted:#91a8c0;--border:#1b3955}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{min-height:100vh;margin:0;color:#f0f7ff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(ellipse at 50% 5%,#0d5481 0%,transparent 55%),radial-gradient(ellipse at 95% 85%,#073958 0%,transparent 45%),linear-gradient(180deg,#061b32,#030d1b)}
header{height:82px;padding:0 clamp(22px,7vw,100px);display:flex;align-items:center;border-bottom:1px solid var(--border);background:rgba(3,13,27,.7)}
.logo{width:225px;max-width:70vw;height:auto;display:block}
main{min-height:calc(100vh - 146px);display:grid;place-items:center;padding:65px 22px}
.panel{position:relative;width:min(780px,100%);padding:clamp(32px,6vw,72px) clamp(24px,6vw,68px);text-align:center;border:1px solid #24618a;border-radius:22px;background:linear-gradient(145deg,rgba(14,43,68,.88),rgba(6,20,37,.96));box-shadow:0 28px 95px rgba(0,0,0,.28),0 0 90px rgba(0,170,255,.08)}
.eyebrow{display:inline-flex;align-items:center;gap:10px;color:var(--cyan);font-size:12px;font-weight:800;letter-spacing:3px;text-transform:uppercase}
.dot{width:9px;height:9px;border-radius:50%;background:var(--cyan);box-shadow:0 0 17px rgba(77,226,255,.65)}
h1{margin:26px 0 20px;font-size:clamp(42px,7vw,78px);line-height:1.05;letter-spacing:-2.5px;font-weight:900}
h1 span{color:var(--cyan)}
p{max-width:540px;margin:0 auto;color:#b0c9dc;font-size:clamp(15px,2vw,18px);line-height:1.8}
.divider{height:1px;max-width:360px;margin:35px auto;background:linear-gradient(90deg,transparent,#2c7198,transparent)}
.caption{font-size:12px;color:var(--muted);letter-spacing:.7px}
footer{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px clamp(22px,7vw,100px);border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
@media(max-width:550px){header{height:72px}.logo{width:180px}main{min-height:calc(100vh - 136px);padding:35px 16px}.panel{border-radius:16px}h1{letter-spacing:-1.5px}footer{flex-direction:column;justify-content:center;text-align:center}}
</style>
</head>
<body>
<header><a href="/" aria-label="EloScanner home"><img class="logo" src="/assets/eloscanner-logo.svg" alt="EloScanner"></a></header>
<main><section class="panel" aria-labelledby="page-title">
<div class="eyebrow"><span class="dot" aria-hidden="true"></span> We're upgrading EloScanner</div>
<h1 id="page-title">Under<br><span>Construction.</span></h1>
<p>We're building a better chess analysis experience with deeper insights, smarter preparation, and more powerful game reviews.</p>
<div class="divider" aria-hidden="true"></div>
<p class="caption">EloScanner is temporarily unavailable. Check back soon.</p>
</section></main>
<footer><span>© <span id="year">2026</span> EloScanner</span><span>Independent chess analysis</span></footer>
</body></html>
