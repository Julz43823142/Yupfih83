<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Top 100 EloScanner Puzzle Sprint and Puzzle Survival community scores.">
<title>Top 100 Puzzle Scores | EloScanner</title>
<link rel="icon" href="/favicon-horse.svg?v=3" type="image/svg+xml">
<link rel="stylesheet" href="/style.css?v=20261103"><link rel="stylesheet" href="/puzzles.css?v=5">
</head><body>
<header class="navbar puzzles-navbar"><a class="brand" href="/"><img class="brand-logo" src="/assets/eloscanner-logo.svg" alt="EloScanner"></a>
<nav class="puzzles-site-nav" aria-label="Chess Tools"><a href="/">Home</a><a href="/analysis.html">Analyse</a><a href="/player-prep.html">Player Prep</a><a href="/puzzles.html" aria-current="page">Puzzles</a><a href="/minigames.html">Minigames</a></nav>
<details class="mobile-chess-menu puzzles-mobile-menu"><summary aria-label="Open navigatiemenu"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Menu</summary><nav><a href="/">Home</a><a href="/analysis.html">Analyse</a><a href="/player-prep.html">Player Prep</a><a href="/puzzles.html" aria-current="page">Puzzles</a><a href="/minigames.html">Minigames</a></nav></details>
</header>
<main class="puzzles-page puzzle-leaderboard-page">
 <header class="puzzles-top"><h1 id="score-title">Top 100 Puzzle Sprint</h1></header>
 <div class="puzzles-tabs" role="navigation" aria-label="Select leaderboard">
  <a href="/puzzle-top100.html?mode=sprint" id="rank-sprint">Puzzle Sprint</a>
  <a href="/puzzle-top100.html?mode=survival" id="rank-survival">Puzzle Survival</a>
  <a href="/puzzles.html">Back to Puzzles</a>
 </div>
 <section class="puzzle-rank-card">
 <table class="puzzle-top100-table"><thead><tr><th>Rank</th><th>Nickname</th><th>Score</th></tr></thead><tbody id="score-rows"><tr><td colspan="3">Loading scores…</td></tr></tbody></table>
 </section>
 <p class="puzzle-ranking-note">Community-submitted scores are not independently verified.</p>
</main>
<footer><span>© <span id="year">2026</span> EloScanner</span><span>Independent chess analysis</span></footer>
<script>
document.getElementById('year').textContent=new Date().getFullYear();
const m=new URLSearchParams(location.search).get('mode')==='survival'?'survival':'sprint';
document.getElementById('score-title').textContent=m==='survival'?'Top 100 Puzzle Survival':'Top 100 Puzzle Sprint';
document.getElementById('rank-'+m).setAttribute('aria-current','page');
(async()=>{
 const tbody=document.getElementById('score-rows');
 try{
  const resp=await fetch('/api/puzzle-leaderboard?mode='+m+'&limit=100',{cache:'no-store'});
  const data=await resp.json();if(!resp.ok)throw Error(data.error||'Could not load the leaderboard.');
  tbody.replaceChildren();
  if(!data.scores?.length){const row=tbody.insertRow();const td=row.insertCell();td.colSpan=3;td.textContent='No community scores yet.';return}
  for(const score of data.scores){
   const row=tbody.insertRow();
   [score.rank,score.nickname,score.score].forEach(value=>{const td=row.insertCell();td.textContent=String(value)});
  }
 }catch(error){tbody.replaceChildren();const row=tbody.insertRow(),td=row.insertCell();td.colSpan=3;td.textContent=error.message}
})();
</script></body></html>
